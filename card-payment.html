    <div class="proceedex">
        <div class="credeb">
            <div class="solid-credit">
                <i class="fa-solid fa-credit-card"></i>
            </div>
            <div>
                <h2></i>Credit/Debit Card Payment</h2>
                <p>Enter your card details to complete your payment securely.</p>
            </div>
        </div>


    </div>
    <div class="accepted-info">

        <div class="available-detail">
            <div class="available-cards">
                <h2 class="Acc">Accepted Cards</h2>

                <div class="master-visa">
                    <img src="picture/akuptsova-a-plastic-card-1647376_640.jpg" alt="master-card" class="master-card">
                    <img src="picture/falco-cheque-guarantee-card-229830_640.jpg" alt="visa card" class="visa-card">
                </div>
            </div>
        </div>



        <div class="cardpayment-form">
            <div class="form-details">
                <form id="cardPaymentForm" action="card-payment.html" method="post">
                    <label for="Card Number">
                        <p class="ptag"> Card Number</p>
                        <input type="text" name="card number" id="Card number" placeholder="Card Number" required>
                    </label>
                    <label for="Card holder Name">
                        <p class="ptag"> Card holder Name</p>
                        <input type="text" name="card holder name" id="Card holder name" placeholder="Card Holder Name"
                            required>
                    </label>
                    <div class="form-div">
                        <div class="expire-date">

                            <label for="Expiration Date">
                                <p class="ptag"> Expiry Date</p>
                                <input type="text" name="expiration date" id="Expiration Date" placeholder="MM/YY"
                                    required>

                            </label>
                        </div>


                        <div class="cvv">
                            <label for="CVV">
                                <p class="ptag"> CVV</p>
                                <input type="text" name="cvv" id="CVV" placeholder="123" required>
                            </label>
                        </div>

                    </div>
                    <div class="submittyp">
                        <button type="submit">Make your Payment</button>
                    </div>

                </form>


            </div>


        </div>

    </div>
    <div class="footer-flex">
